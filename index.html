<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waruna Rathnayake Science | Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --primary: #3b82f6; --secondary: #0f172a; --accent: #06b6d4; 
            --text-light: #f8fafc; --text-dark: #1e293b; --success: #10b981;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 0; background-color: var(--secondary); color: var(--text-light); }

        .portal-wrapper { padding: 40px 5%; display: flex; justify-content: center; min-height: 100vh; align-items: center; background: linear-gradient(rgba(15,23,42,0.9), rgba(15,23,42,0.9)), url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1920&q=80') center/cover; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center; }
        
        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--accent); margin-bottom: 20px; letter-spacing: 2px;}
        .brand-title span { color: white; }

        .auth-tabs { display: flex; justify-content: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .auth-tab { padding: 10px 20px; cursor: pointer; color: #94a3b8; font-weight: bold; transition: 0.3s; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        
        .form-section { display: none; animation: fadeIn 0.4s; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; }
        .glass-input { width: 100%; padding: 12px; box-sizing: border-box; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; border-radius: 8px; font-size: 14px; transition: 0.3s;}
        .glass-input:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, 0.15); }
        .glass-input::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        .btn-glow { background: linear-gradient(45deg, var(--primary), var(--accent)); border: none; padding: 12px 20px; color: white; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);}
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5); }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }
        .btn-outline:hover { background: rgba(6,182,212,0.1); }
        
        .link-text { color: var(--accent); font-size: 12px; cursor: pointer; margin-top: 15px; display: inline-block;}
        .msg-box { margin-top: 15px; font-size: 13px; font-weight: bold; min-height: 20px;}
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <div class="glass-panel">
            <div class="brand-title">WARUNA <span>RATHNAYAKE</span></div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                <div class="auth-tab" onclick="switchTab('register')">Register</div>
            </div>

            <div id="form-login" class="form-section active">
                <div class="input-group">
                    <label>16-Digit Smart Card Number</label>
                    <input type="text" class="glass-input" placeholder="2012 xxxx xxxx xxxx" maxlength="19">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="glass-input" placeholder="••••••••">
                </div>
                <button class="btn-glow" onclick="alert('Logging into Student Dashboard...')">Secure Login</button>
                <div class="link-text">Forgot Password?</div>
            </div>

            <div id="form-register" class="form-section">
                
                <div id="step-info">
                    <p style="font-size: 12px; color: #94a3b8; margin-top: 0;">නව ගිණුමක් සෑදීම සඳහා ඔබගේ නිවැරදි තොරතුරු ඇතුළත් කරන්න.</p>
                    <div class="input-group">
                        <label>16-Digit Smart Card Number</label>
                        <input type="text" class="glass-input" placeholder="2012 xxxx xxxx xxxx">
                    </div>
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" class="glass-input" placeholder="Enter Your Name Here">
                    </div>
                    <div class="input-group">
                        <label>Mobile Number (For OTP Verification)</label>
                        <input type="tel" class="glass-input" placeholder="07x xxx xxxx">
                    </div>
                    <button class="btn-glow" onclick="sendOTP()">Send SMS OTP</button>
                </div>

                <div id="step-otp" style="display: none;">
                    <p style="font-size: 12px; color: var(--success); margin-top: 0;">✔ SMS පණිවිඩය සාර්ථකව යවන ලදී.</p>
                    <div class="input-group">
                        <label>Enter 6-Digit OTP Code</label>
                        <input type="text" class="glass-input" placeholder="X X X X X X" style="text-align: center; letter-spacing: 5px; font-weight: bold; font-size: 18px;" maxlength="6">
                    </div>
                    <button class="btn-glow" onclick="verifyOTP()">Verify Mobile</button>
                    <button class="btn-glow btn-outline" onclick="backToInfo()">Back</button>
                </div>

                <div id="step-finalize" style="display: none;">
                    <p style="font-size: 12px; color: var(--accent); margin-top: 0;">ජංගම දුරකථනය තහවුරු විය. ගිණුම සම්පූර්ණ කරන්න.</p>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" class="glass-input" placeholder="student@gmail.com">
                    </div>
                    <div class="input-group">
                        <label>Create New Password</label>
                        <input type="password" class="glass-input" placeholder="••••••••">
                    </div>
                    <button class="btn-glow" style="background: var(--success);" onclick="alert('Account Successfully Created! Your details are saved in the Database.')">Register Now</button>
                </div>

                <div id="auth-msg" class="msg-box"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('form-login').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('form-register').classList.add('active');
                
                // Reset steps
                document.getElementById('step-info').style.display = 'block';
                document.getElementById('step-otp').style.display = 'none';
                document.getElementById('step-finalize').style.display = 'none';
                document.getElementById('auth-msg').innerHTML = '';
            }
        }

        function sendOTP() {
            const msg = document.getElementById('auth-msg');
            msg.style.color = 'var(--accent)';
            msg.innerHTML = "Sending SMS Verification Code...";
            
            setTimeout(() => {
                document.getElementById('step-info').style.display = 'none';
                document.getElementById('step-otp').style.display = 'block';
                msg.innerHTML = "";
            }, 1000);
        }

        function verifyOTP() {
            const msg = document.getElementById('auth-msg');
            msg.style.color = 'var(--success)';
            msg.innerHTML = "Authenticating OTP...";
            
            setTimeout(() => {
                document.getElementById('step-otp').style.display = 'none';
                document.getElementById('step-finalize').style.display = 'block';
                msg.innerHTML = "";
            }, 1000);
        }

        function backToInfo() {
            document.getElementById('step-otp').style.display = 'none';
            document.getElementById('step-info').style.display = 'block';
            document.getElementById('auth-msg').innerHTML = "";
        }
    </script>
</body>
</html>
